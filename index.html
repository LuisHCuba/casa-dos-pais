<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa dos pais</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; font: 13px system-ui, sans-serif; }
      #app, canvas, .labels { position: absolute; inset: 0; }
      .labels { pointer-events: none; }
      .room-label { background: #ffffffcc; padding: 2px 6px; border-radius: 4px; text-align: center; color: #333; }
      #toolbar { position: absolute; top: 12px; left: 12px; background: #fff; padding: 8px 10px; border-radius: 8px;
        box-shadow: 0 2px 8px #0002; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 2; }
      #toolbar button { padding: 4px 10px; }
      #info { position: absolute; top: 12px; right: 12px; width: 320px; max-height: 70vh; overflow: auto; background: #fff;
        padding: 10px; border-radius: 8px; box-shadow: 0 2px 8px #0002; z-index: 2; }
      #info pre { font-size: 11px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toolbar">
      <b>Casa dos pais</b>
      <button data-view="3d">3D</button>
      <button data-view="2d">2D</button>
      <label><input type="checkbox" data-toggle="furniture" checked /> Móveis</label>
      <label><input type="checkbox" data-toggle="openings" checked /> Portas/janelas</label>
      <label><input type="checkbox" data-toggle="walls" checked /> Paredes</label>
      <label><input type="checkbox" data-toggle="labels" checked /> Rótulos</label>
    </div>
    <div id="info" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
